<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<p>My first webapp</p>

	<!-- **Comments Uses -->
	<!-- 1. Used to hide codes that users should not see -->
	<!-- 2. They are used for taking notes -->

	<!-- **Elements: Elements display info on the browser -->
	<!-- List of elements: -->
  <!-- div: Serves as container to divs and other elements -->
	<div>
		<p></p>
	</div>

	<!-- paragraph: They are used for writing text -->
	<p>
		This is a paragraph, mainly used for texts.
	</p>

	<!-- span: Used for inline-text -->
	<p>
		The 
		<span style="color: red; font-size: 30px; font-weight: 500;">place</span>
	</p>

	<!-- anchor: Used for navigating from one page to another inside your app or from one page in your app to another app (redirection) -->

	<!-- Navigating from one page in your web app to another webapp: -->
	<a href="https://www.jumia.com.ng" target="_blank">Jumia</a>
	<a href="https://www.konga.com" target="_blank">Konga</a>
  
</body>
</html>
