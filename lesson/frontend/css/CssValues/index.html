<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<!-- *** CSS Values: -->
	<!-- ** 1. Absolute values -->
	<!-- Pixels(px) -->
	<div 
		style="
			background-color: yellow;
			width: 600px;
			height: 200px;
			display: flex;
			justify-content: end;"
	>
		<p>Absolute values</p>
	</div>

	<!-- Ems(em) -->
	<div 
		style="
			background-color: yellow;
			width: 40em;
			height: 200px;
			display: flex;
			justify-content: end;"
	>
		<p>Absolute values</p>
	</div>

	<!-- Rem(rem) -->
	<div 
		style="
			background-color: yellow;
			width: 600px;
			height: 200px;
			display: flex;
			justify-content: end;"
	>
		<p>Absolute values</p>
	</div>

	<!-- ***2. Relative values -->
	<!-- Percent(%) -->
	<div 
		style="
			background-color: yellow;
			width: 60%;
			height: 200px;
			display: flex;
			justify-content: end;"
	>
		<p>Relative values</p>
	</div>

	<!-- Viewport(width&height) -->
	<div 
		style="
			background-color: yellow;
			width: 60vw;
			height: 200px;
			display: flex;
			justify-content: end;"
	>
		<p>Absolute values</p>
	</div>
</body>
</html>
